name: fixtures

# Fixture PNG/JPEG bytes depend on the font stack, and fonts/Inter.ttf is a
# VARIABLE font. node-canvas can only instance it where fontconfig handles
# variable axes — which rules out generating on Windows, where registerFont
# silently falls back to sans. Linux is therefore the canonical generation
# platform and this workflow is the only supported way to produce fixture
# images. Do not commit documents/ generated on a developer laptop.

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: 'Regenerate documents/ and upload them as an artifact'
        type: boolean
        default: false
  push:
    branches-ignore: []
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # canvas 3.x ships linux-x64 prebuilds; this is belt-and-braces for the
      # case where it falls back to a source build.
      - name: System deps (fallback only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev \
            libjpeg-dev libgif-dev librsvg2-dev fontconfig || true

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Font sanity check
        run: |
          node -e "
          const {registerFont,createCanvas}=require('canvas');
          registerFont('fonts/Inter.ttf',{family:'Inter'});
          const c=createCanvas(400,60), x=c.getContext('2d');
          x.font='20px Inter'; const a=x.measureText('Handgloves 12345').width;
          x.font='20px NoSuchFontXYZ'; const b=x.measureText('Handgloves 12345').width;
          console.log('Inter width', a, '/ fallback width', b);
          if (a===b) { console.error('FATAL: Inter did not register — generated bytes would be wrong'); process.exit(1); }
          console.log('Inter registered correctly');
          "

      # Run generation FIRST and report the full drift surface. Validation
      # aborts on the first mismatch, which hides how widespread any drift is.
      - name: Regenerate and diff against tracked bytes
        id: drift
        continue-on-error: true
        run: |
          npm run generate 2>/dev/null
          if git diff --quiet -- documents manifest_v2.json; then
            echo "REPRODUCIBLE: regeneration is byte-identical to tracked fixtures"
          else
            echo "DIVERGENCE: the current generator does not reproduce tracked bytes"
            echo "--- files that differ ---"
            git diff --name-only -- documents manifest_v2.json
            echo "--- size delta ---"
            git diff --stat -- documents manifest_v2.json | tail -20
          fi

      - name: Capture regenerated output and compare
        run: |
          mkdir -p /tmp/regen
          cp -r documents /tmp/regen/
          cp manifest_v2.json /tmp/regen/ || true
          echo "--- dimension + size comparison, tracked vs regenerated ---"
          for f in $(git diff --name-only -- documents | head -6); do
            git show HEAD:"$f" > /tmp/tracked.png 2>/dev/null || continue
            node -e "
              const fs=require('fs');
              const d=p=>{const b=fs.readFileSync(p);return {w:b.readUInt32BE(16),h:b.readUInt32BE(20),bytes:b.length};};
              const t=d('/tmp/tracked.png'), r=d('$f');
              console.log('$f'.padEnd(58),
                'tracked', t.w+'x'+t.h, t.bytes+'B',
                '| regen', r.w+'x'+r.h, r.bytes+'B',
                (t.w===r.w&&t.h===r.h)?'[same dims]':'[DIMS DIFFER]');
            "
          done

      - name: Restore tracked bytes before validating
        run: git checkout -- documents manifest_v2.json

      - name: Validate tracked fixtures
        continue-on-error: true
        run: npm test 2>/dev/null

      - name: Upload generated documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-documents
          path: /tmp/regen/
          retention-days: 14
