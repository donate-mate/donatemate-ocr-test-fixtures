name: fixtures

# WHY THIS RUNS IN A PINNED CONTAINER
#
# validate_fixtures.js asserts tracked bytes equal freshly generated bytes
# (tracked.equals(rendered)). That assertion is only meaningful if the
# rendering environment is fixed, and it was not: as of 2026-09-01 all 62
# tracked documents failed it on ubuntu-latest, with identical dimensions and
# ~0.1% byte deltas — the signature of a different FreeType/fontconfig build,
# not of stale content. The documents and the generator were last changed in
# the same commit (6756cf7), so nothing had drifted in the repo; only the
# machine had.
#
# fonts/Inter.ttf is also a VARIABLE font. node-canvas can only instance it
# where fontconfig handles variable axes. On Windows registerFont silently
# falls back to sans (Inter and sans measure identically at 82.02px), which
# would produce byte-wrong documents that still look plausible. The font
# sanity check below fails the build rather than letting that happen.
#
# Debian bookworm freezes freetype/fontconfig/cairo/pango for its release
# lifetime, so this container is the canonical generation environment.
# Regenerate fixtures ONLY via the workflow_dispatch below. Never commit
# documents/ generated on a developer machine.

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: 'Regenerate all documents and upload them as an artifact to commit'
        type: boolean
        default: false
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Record rendering environment
        run: |
          echo "node        $(node --version)"
          echo "distro      $(. /etc/os-release && echo "$PRETTY_NAME")"
          dpkg -l | awk '/libfreetype6|libfontconfig1|libcairo2 |libpango-1/ {printf "%-24s %s\n", $2, $3}'
          echo "canvas      $(node -p "require('canvas/package.json').version")"

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # A silent sans fallback would generate wrong bytes that still validate
      # against each other. Fail loudly instead.
      - name: Font sanity check
        run: |
          node -e "
          const {registerFont,createCanvas}=require('canvas');
          registerFont('fonts/Inter.ttf',{family:'Inter'});
          const c=createCanvas(400,60), x=c.getContext('2d');
          x.font='20px Inter';          const a=x.measureText('Handgloves 12345').width;
          x.font='20px NoSuchFontXYZ';  const b=x.measureText('Handgloves 12345').width;
          console.log('Inter', a, '| fallback', b);
          if (a===b) { console.error('FATAL: Inter did not register; generated bytes would be wrong'); process.exit(1); }
          console.log('Inter registered correctly');
          "

      - name: Regenerate
        run: npm run generate 2>/dev/null

      - name: Compare against tracked bytes
        run: |
          if git config --global --add safe.directory "$PWD" && git diff --quiet -- documents manifest_v2.json; then
            echo "REPRODUCIBLE: regeneration is byte-identical to tracked fixtures"
          else
            echo "DIVERGENCE: $(git diff --name-only -- documents manifest_v2.json | wc -l) file(s) differ from tracked bytes"
            git diff --name-only -- documents manifest_v2.json
            echo ""
            echo "If this is the first run after adopting this container, download the"
            echo "regenerated-documents artifact and commit it once. After that, any"
            echo "divergence here is a real regression."
          fi

      - name: Upload regenerated documents
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-documents
          path: |
            documents/
            manifest_v2.json
          retention-days: 14

      - name: Validate
        run: npm test 2>/dev/null
